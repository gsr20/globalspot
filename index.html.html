  <style>
    * {

      margin: 0;

    body {
      min-height: 100vh;
      width: 100vw;
      /* Substitua a URL abaixo pela imagem de fundo que desejar */

      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      width: 100%;
      justify-items: center;
    }

    .card {
      background-color: rgba(255, 254, 255, 0.974);
      border: 3px solid #9f2ee0;
      border-radius: 20px;
      padding: 15px;
      width: 100%;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 12px;
    }

    .btn-link {
      display: inline-block;
      width: 100%;
      padding: 10px 0;
      background-color: #0011ffad;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-link:hover {
      background-color: #0056b3;
    }
  </style>
</head>
